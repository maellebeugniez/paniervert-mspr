services:
  paniervert:
    build: .
    container_name: paniervert-mspr
    volumes:
      - ./data:/app/data
    command: python src/pipeline.py

  streamlit:
    build: .
    container_name: paniervert-streamlit
    volumes:
      - ./data:/app/data
    ports:
      - "8501:8501"
    command: streamlit run src/dashboard.py --server.address=0.0.0.0 --server.port=8501

  api:
    build: .
    container_name: paniervert-api
    volumes:
      - ./models:/app/models:ro
    ports:
      - "3000:3000"
    command: bentoml serve src.api.service:SegmentClassifier --host 0.0.0.0 --port 3000
